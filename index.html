<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>විෂයානුබද්ධ වාග් මාලාව</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700;800&family=Noto+Serif+Sinhala:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --forest-900:#0f2e21;
    --forest-800:#163d2c;
    --forest-700:#1b4332;
    --forest-600:#2d6a4f;
    --mint-300:#95d5b2;
    --mint-200:#b7e4c7;
    --mint-100:#d9f2e4;
    --paper:#f4faf6;
    --paper-2:#ffffff;
    --ink:#12231a;
    --ink-soft:#3f5c4c;
    --shadow:0 10px 30px rgba(15,46,33,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; min-height:100%;}
  body{
    background:
      radial-gradient(1200px 520px at 50% -12%, var(--mint-100) 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 100%, var(--mint-100) 0%, transparent 55%),
      var(--paper);
    font-family:'Noto Sans Sinhala', sans-serif;
    color:var(--ink);
    display:flex; flex-direction:column; min-height:100vh;
  }
  h1,h2,.brand{font-family:'Noto Serif Sinhala', serif;}

  header{
    background:linear-gradient(120deg, var(--forest-900), var(--forest-700) 65%, var(--forest-600));
    padding:54px 20px 70px;
    text-align:center;
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  header::before{
    content:"";
    position:absolute; left:-80px; top:-80px; width:260px; height:260px; border-radius:50%;
    background:radial-gradient(circle, rgba(149,213,178,0.22), transparent 70%);
  }
  header::after{
    content:"";
    position:absolute; right:-60px; bottom:-100px; width:260px; height:260px; border-radius:50%;
    background:radial-gradient(circle, rgba(183,228,199,0.18), transparent 70%);
  }
  header h1{margin:0 0 10px; font-size:2.1rem; letter-spacing:.2px;}
  header p{margin:0; color:var(--mint-200); font-size:1rem;}

  main{flex:1; max-width:760px; width:100%; margin:0 auto; padding:0 20px;}

  .search-wrap{
    margin-top:-38px;
    background:var(--paper-2);
    border-radius:18px;
    box-shadow:var(--shadow);
    border:1px solid var(--mint-200);
    padding:12px;
    position:relative;
    z-index:5;
  }
  .search-row{display:flex; gap:10px;}
  .search-row input{
    flex:1; border:none; outline:none; padding:16px 18px; font-size:1.05rem;
    font-family:inherit; color:var(--ink); background:transparent;
  }
  .search-row button{
    background:var(--forest-700); color:#fff; border:none; padding:0 26px;
    border-radius:12px; font-family:inherit; font-size:1rem; font-weight:600; cursor:pointer;
    transition:.18s;
  }
  .search-row button:hover{background:var(--forest-600);}

  .suggestions{
    position:relative;
    background:var(--paper-2);
    border-radius:0 0 14px 14px;
    overflow:hidden;
    box-shadow:var(--shadow);
    border:1px solid var(--mint-200);
    border-top:none;
    margin-top:-4px;
    display:none;
  }
  .suggestions.show{display:block;}
  .suggestion-item{
    padding:13px 20px; cursor:pointer; font-size:.98rem; color:var(--forest-800);
    border-bottom:1px solid var(--mint-100); transition:.12s;
  }
  .suggestion-item:last-child{border-bottom:none;}
  .suggestion-item:hover, .suggestion-item.active{background:var(--mint-100);}
  .suggestion-item b{color:var(--forest-900);}

  .hint{text-align:center; color:var(--ink-soft); font-size:.88rem; margin:22px 0 40px;}

  .recent-title{font-size:1rem; color:var(--forest-800); margin:0 0 12px; font-weight:700;}
  .chip-row{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:50px;}
  .chip{
    background:var(--mint-100); color:var(--forest-700); padding:8px 16px; border-radius:999px;
    font-size:.88rem; cursor:pointer; border:1px solid var(--mint-200); transition:.15s;
  }
  .chip:hover{background:var(--mint-200);}

  footer{
    text-align:center; padding:26px 20px; color:var(--forest-700); font-size:.85rem;
    background:var(--mint-100); border-top:1px solid var(--mint-200); margin-top:auto;
  }

  /* popup */
  .overlay{
    display:none; position:fixed; inset:0; background:rgba(15,46,33,0.6);
    align-items:center; justify-content:center; z-index:200; padding:20px;
    backdrop-filter:blur(3px);
  }
  .overlay.show{display:flex;}
  .popup{
    background:var(--paper-2); border-radius:20px; max-width:560px; width:100%;
    max-height:82vh;
    box-shadow:0 24px 70px rgba(15,46,33,0.35);
    animation:pop .18s ease-out;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  @keyframes pop{ from{transform:scale(.94); opacity:0;} to{transform:scale(1); opacity:1;} }
  .popup-head{
    background:linear-gradient(120deg, var(--forest-800), var(--forest-600));
    color:#fff; padding:24px 28px; position:relative;
    flex-shrink:0;
  }
  .popup-head h2{margin:0; font-size:1.5rem;}
  .popup-head .cat{
    display:inline-block; margin-top:8px; background:rgba(255,255,255,0.16);
    border:1px solid rgba(255,255,255,0.3); padding:3px 13px; border-radius:999px; font-size:.78rem;
  }
  .popup-close{
    position:absolute; top:16px; right:18px; background:transparent; border:none; color:#fff;
    font-size:1.4rem; cursor:pointer; line-height:1; opacity:.85;
  }
  .popup-close:hover{opacity:1;}
  .popup-body{
    padding:24px 28px 8px;
    overflow-y:auto;
    flex:1 1 auto;
    min-height:0;
  }
  .popup-body::-webkit-scrollbar{width:8px;}
  .popup-body::-webkit-scrollbar-track{background:var(--mint-100); border-radius:8px;}
  .popup-body::-webkit-scrollbar-thumb{background:var(--mint-300); border-radius:8px;}
  .popup-body::-webkit-scrollbar-thumb:hover{background:var(--forest-600);}
  .popup-field{margin-bottom:18px;}
  .popup-field label{display:block; font-size:.78rem; font-weight:700; color:var(--forest-700); margin-bottom:5px; text-transform:none;}
  .popup-field p{margin:0; color:var(--ink); line-height:1.7; font-size:.98rem;}
  .popup-footer{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:16px 28px 22px; border-top:1px solid var(--mint-100);
    flex-shrink:0; background:var(--paper-2);
  }
  .author-tag{font-size:.85rem; color:var(--ink-soft);}
  .author-tag b{color:var(--forest-700);}
  .no-result{padding:40px 28px; text-align:center; color:var(--ink-soft);}
</style>
</head>
<body oncontextmenu="return false;">

<header>
  <h1>විෂයානුබද්ධ වාග් මාලාව</h1>
  <p>විෂය ආශ්‍රිත වචන සහ ඒවායේ අර්ථ විස්තර සොයන්න</p>
</header>

<main>
  <div class="search-wrap">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="වචනයක් ටයිප් කරන්න..." autocomplete="off">
      <button id="searchBtn">සොයන්න</button>
    </div>
  </div>
  <div class="suggestions" id="suggestions"></div>

  <p class="hint">යතුරු ලියනය කරන විට ආසන්නතම යෝජනා පහත දිස්වේ. සම්පූර්ණ විස්තරය බැලීමට ප්‍රතිඵලයක් ක්ලික් කරන්න.</p>
</main>

<footer>කලාපීය ගුරු සහයෝගීතාව</footer>

<!-- Result popup -->
<div class="overlay" id="popupOverlay">
  <div class="popup" id="popupContent"></div>
</div>

<script>
const SUPABASE_URL = "https://uqgzlaxsnknheoerbfus.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxZ3psYXhzbmtuaGVvZXJiZnVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5MjM2MTUsImV4cCI6MjA3OTI4MzYxNX0.IYWZ7ukx8J-GJMWy7cMk2BWnmzJmJjjE93yEmJie7nQ";
const REST = `${SUPABASE_URL}/rest/v1`;
const HEADERS = { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` };

document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("keydown", e => { if (e.key === "F12") e.preventDefault(); });

function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

const input = document.getElementById("searchInput");
const suggBox = document.getElementById("suggestions");
let debounceTimer = null;
let activeIndex = -1;
let currentSuggestions = [];

input.addEventListener("input", () => {
  clearTimeout(debounceTimer);
  const q = input.value.trim();
  activeIndex = -1;
  if (q.length < 1){
    suggBox.classList.remove("show");
    suggBox.innerHTML = "";
    return;
  }
  debounceTimer = setTimeout(() => fetchSuggestions(q), 220);
});

input.addEventListener("keydown", (e) => {
  const items = suggBox.querySelectorAll(".suggestion-item");
  if (e.key === "ArrowDown"){
    e.preventDefault();
    activeIndex = Math.min(activeIndex + 1, items.length - 1);
    updateActive(items);
  } else if (e.key === "ArrowUp"){
    e.preventDefault();
    activeIndex = Math.max(activeIndex - 1, 0);
    updateActive(items);
  } else if (e.key === "Enter"){
    if (activeIndex >= 0 && currentSuggestions[activeIndex]){
      openResult(currentSuggestions[activeIndex].id);
    } else {
      runSearch(input.value.trim());
    }
  } else if (e.key === "Escape"){
    suggBox.classList.remove("show");
  }
});

function updateActive(items){
  items.forEach((it, idx) => it.classList.toggle("active", idx === activeIndex));
}

async function fetchSuggestions(q){
  try{
    const res = await fetch(`${REST}/word_aliases?word=ilike.*${encodeURIComponent(q)}*&status=eq.published&select=id,word,category&order=word.asc&limit=6`, { headers: HEADERS });
    const rows = await res.json();
    currentSuggestions = rows;
    if (rows.length === 0){
      suggBox.innerHTML = `<div class="suggestion-item" style="cursor:default; color:var(--ink-soft);">ගැලපෙන ප්‍රතිඵල හමු නොවීය</div>`;
      suggBox.classList.add("show");
      return;
    }
    suggBox.innerHTML = rows.map((r, idx) => `
      <div class="suggestion-item" data-id="${r.id}">
        <b>${escapeHtml(r.word)}</b>${r.category ? ` <span style="color:var(--ink-soft); font-size:.85rem;">— ${escapeHtml(r.category)}</span>` : ""}
      </div>`).join("");
    suggBox.classList.add("show");
    suggBox.querySelectorAll(".suggestion-item[data-id]").forEach(el => {
      el.addEventListener("click", () => openResult(el.dataset.id));
    });
  } catch(e){
    suggBox.classList.remove("show");
  }
}

document.getElementById("searchBtn").addEventListener("click", () => runSearch(input.value.trim()));

async function runSearch(q){
  if (!q) return;
  suggBox.classList.remove("show");
  try{
    const res = await fetch(`${REST}/word_aliases?word=ilike.*${encodeURIComponent(q)}*&status=eq.published&select=*&order=word.asc&limit=1`, { headers: HEADERS });
    const rows = await res.json();
    if (rows.length === 0){
      showPopupNoResult(q);
    } else {
      renderPopup(rows[0]);
    }
  } catch(e){
    showPopupNoResult(q);
  }
}

async function openResult(id){
  suggBox.classList.remove("show");
  try{
    const res = await fetch(`${REST}/word_aliases?id=eq.${id}&status=eq.published&select=*`, { headers: HEADERS });
    const rows = await res.json();
    if (rows.length) renderPopup(rows[0]);
  } catch(e){}
}

function renderPopup(r){
  const content = document.getElementById("popupContent");
  content.innerHTML = `
    <div class="popup-head">
      <button class="popup-close" id="closePopup">&times;</button>
      <h2>${escapeHtml(r.word)}</h2>
      ${r.category ? `<span class="cat">${escapeHtml(r.category)}</span>` : ""}
    </div>
    <div class="popup-body">
      <div class="popup-field">
        <label>අර්ථ විස්තරය</label>
        <p>${escapeHtml(r.meaning || "-")}</p>
      </div>
      ${r.summary ? `<div class="popup-field"><label>සාරාංශය</label><p>${escapeHtml(r.summary)}</p></div>` : ""}
      ${r.source ? `<div class="popup-field"><label>මූලාශ්‍රය</label><p>${escapeHtml(r.source)}</p></div>` : ""}
    </div>
    <div class="popup-footer">
      <span class="author-tag">ඇතුළත් කළේ: <b>${escapeHtml(r.author || "නොදන්නා")}</b></span>
    </div>`;
  document.getElementById("popupOverlay").classList.add("show");
  document.getElementById("closePopup").addEventListener("click", closePopup);
}

function showPopupNoResult(q){
  const content = document.getElementById("popupContent");
  content.innerHTML = `
    <div class="popup-head">
      <button class="popup-close" id="closePopup">&times;</button>
      <h2>ප්‍රතිඵල හමු නොවීය</h2>
    </div>
    <div class="no-result">"${escapeHtml(q)}" සඳහා ගැලපෙන කිසිදු වචනයක් හමු නොවීය.</div>`;
  document.getElementById("popupOverlay").classList.add("show");
  document.getElementById("closePopup").addEventListener("click", closePopup);
}

function closePopup(){
  document.getElementById("popupOverlay").classList.remove("show");
}
document.getElementById("popupOverlay").addEventListener("click", (e) => {
  if (e.target.id === "popupOverlay") closePopup();
});

document.addEventListener("click", (e) => {
  if (!e.target.closest(".search-wrap") && !e.target.closest(".suggestions")){
    suggBox.classList.remove("show");
  }
});
</script>
</body>
</html>
